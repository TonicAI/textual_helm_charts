{{- $top := $ }}
{{- $httpRoutes := $top.Values.httpRoutes }}
{{- $api := $httpRoutes.api }}
{{- if (and $api $api.create) }}
apiVersion: {{ $httpRoutes.apiVersion }}
kind: HTTPRoute
metadata:
  name: "textual-api-server"
  namespace: {{ $top.Release.Namespace }}
  labels:
    {{- with ($api).labels }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "textual.allAnnotations" (list $) | nindent 4 }}
spec:
  parentRefs:
    {{- $api.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- $api.hostnames | toYaml | nindent 4 }}
  rules:
  - backendRefs:
    - name: "textual-api-server"
      port: 443
    timeouts:
      request: "0s"
      backendRequest: "0s"
{{- end }}